name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # RIMOSSO: cache: "yarn" 
          # Disabilitando la cache, forziamo il download pulito delle dipendenze ogni volta.

      # STEP AGGIUNTO: TABULA RASA
      - name: Nuclear Clean
        run: |
          rm -rf .next out node_modules
          echo "Cartelle di build e moduli eliminate."

      - name: Install dependencies
        # Usa --no-lockfile o elimina yarn.lock prima se sospetti che il lockfile sia corrotto,
        # ma di solito install è sufficiente dopo il rm -rf node_modules
        run: yarn install

      - name: Build
        run: yarn build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4